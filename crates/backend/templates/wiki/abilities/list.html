{% extends "base.html" %}
{% block title %}Habilidades — Karta Yaxu{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4 mt-4">
    <h1 style="font-size: 24px;">Habilidades</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 16px;">
    {% for a in abilities %}
    <a href="/wiki/abilities/{{ a.name|slugify }}" class="ability-card">
        <div class="ability-card-header">
            <div class="ability-card-title">{{ a.name }}</div>
        </div>
        <div class="ability-card-body">
            {{ a.description }}
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
