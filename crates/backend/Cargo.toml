[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { path = "../engine", features = ["db"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
askama = "0.12"
tower-sessions = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
tower_governor = "0.8"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
urlencoding = "2"
toml = "0.8"
argon2 = "0.5"
rpassword = "7"
dialoguer = "0.11"
uuid = { version = "1", features = ["v4"] }
strsim = "0.11"
serde_json = "1.0.149"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "create_trainer"
path = "src/bin/create_trainer.rs"
