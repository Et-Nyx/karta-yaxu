{% extends "base.html" %}
{% block title %}Editor de Habilidades — Karta Yaxu{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4 mt-4">
    <h1 style="font-size: 24px;">Editor: Habilidades</h1>
    <a href="/editor/abilities/new" class="btn btn-primary" style="background-color: var(--primary); color: var(--primary-foreground);">+ NOVA HABILIDADE</a>
</div>
<div class="gb-card elevation-1">
    <table style="width: 100%; border-collapse: collapse; font-size: 10px;" class="stats-table">
        <thead>
            <tr style="background-color: var(--primary); color: var(--primary-foreground);">
                <th style="padding: 12px 8px; width: 25%;">Nome</th>
                <th style="padding: 12px 8px;">Descrição</th>
                <th style="padding: 12px 8px;">Ações</th>
            </tr>
        </thead>
        <style>
             .stats-table th, .stats-table td { padding: 12px 8px; border-bottom: 2px solid var(--border); text-align: left; }
        </style>
        <tbody>
            {% for a in abilities %}
            <tr>
                <td>{{ a.name }}</td>
                <td style="line-height: 1.6;">{{ a.description }}</td>
                <td>
                    <a href="/editor/abilities/{{ a.name|slugify }}" class="btn" style="background-color: var(--destructive); color: var(--primary-foreground);">EDITAR</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
