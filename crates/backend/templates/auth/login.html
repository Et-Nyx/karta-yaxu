{% extends "base.html" %}
{% block title %}Login - Karta Yaxu{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="gb-card elevation-2">
        <h1 style="font-size: 20px; text-align: center; margin-bottom: 24px;">LOGIN TRAINER</h1>

        {% if let Some(err) = error %}
        <div style="background-color: var(--destructive); color: var(--primary-foreground); padding: 8px; margin-bottom: 16px; border: 2px solid var(--border); font-size: 10px;">
            {{ err }}
        </div>
        {% endif %}

        <form method="post" action="/trainer/login" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label for="username" style="display: block; margin-bottom: 8px; font-size: 10px;">USERNAME</label>
                <input type="text" id="username" name="username" required style="width: 100%; padding: 12px; background-color: var(--gb-light); color: var(--foreground); border: 2px solid var(--border); box-shadow: inset 2px 2px 0 var(--border); font-family: 'Press Start 2P', monospace; font-size: 10px;">
            </div>

            <div>
                <label for="password" style="display: block; margin-bottom: 8px; font-size: 10px;">SENHA</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 12px; background-color: var(--gb-light); color: var(--foreground); border: 2px solid var(--border); box-shadow: inset 2px 2px 0 var(--border); font-family: 'Press Start 2P', monospace; font-size: 10px;">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px; width: 100%; font-size: 12px; padding: 16px;">
                ENTRAR
            </button>
        </form>

        <p style="margin-top: 24px; font-size: 8px; text-align: center; line-height: 1.8;">
            Não tem conta?<br><a href="/trainer/register" style="color: var(--gb-darkest); text-decoration: underline;">Registre-se aqui</a>
        </p>
    </div>
</div>
{% endblock %}
