{% extends "base.html" %}
{% block title %}Editor de Habilidades — Karta Yaxu{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4 mt-4">
    <h1 style="font-size: 24px;">Editor: Habilidades</h1>
    <a href="/editor/abilities/new" class="btn btn-primary" style="background-color: var(--primary); color: var(--primary-foreground);">+ NOVA HABILIDADE</a>
</div>
<div style="display: flex; flex-direction: column; gap: 16px;">
    {% for a in abilities %}
    <div class="ability-card" data-search-name="{{ a.name|lower }}">
        <div class="ability-card-header">
            <div class="ability-card-title">{{ a.name }}</div>
        </div>
        <div class="ability-card-body">
            {{ a.description }}
        </div>
        <div class="ability-card-actions">
            <a href="/editor/abilities/{{ a.name|slugify }}" class="btn" style="background-color: var(--destructive); color: var(--primary-foreground); padding: 4px 8px; font-size: 8px;">EDITAR</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
