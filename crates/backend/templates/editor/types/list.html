{% extends "base.html" %} 
{% block title %}Editor de Tipos — Karta Yaxu{% endblock %} 
{% block content %}
<div class="flex items-center justify-between mb-4 mt-4">
    <h1 style="font-size: 24px;">Editor: Tipos</h1>
    <a href="/editor/types/new" class="btn btn-primary" style="background-color: var(--primary); color: var(--primary-foreground);">+ NOVO TIPO</a>
</div>
<div class="grid-cards" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
    {% for t in types %}
    <div class="type-card" style="border-color: {{ t.hexcolor }};" data-search-name="{{ t.name|lower }}">
        <div class="type-card-header" style="background-color: {{ t.hexcolor }};">
            {{ t.name|upper }}
        </div>
        <div class="type-card-body flex flex-col justify-center items-center gap-2">
            <img src="/static/icons/types/{{ t.icon }}?v=1" alt="{{ t.name }}" style="width: 48px; height: 48px; image-rendering: pixelated;" data-fallback="hide" />
            <code style="font-size: 8px;">{{ t.hexcolor }}</code>
        </div>
        <div class="pkmn-actions" style="margin-top: 16px;">
            <a href="/editor/types/{{ t.name|slugify }}" class="pkmn-btn" style="background-color: var(--destructive); border-color: var(--destructive);">EDITAR</a>
            <a href="/wiki/types/{{ t.name|slugify }}" class="pkmn-btn" style="background-color: var(--gb-dark); border-color: var(--gb-dark);" target="_blank">WIKI</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
