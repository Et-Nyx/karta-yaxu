<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Karta Yaxu{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="gb-header elevation-2">
        <div class="container flex flex-col items-center justify-center">
            <div class="flex items-center justify-center gap-4 mb-2">
                <div style="width:12px; height:12px; background-color: var(--destructive); border: 2px solid var(--border); border-radius: 50%;"></div>
                <h1 style="font-size: 20px; line-height: 1.5; margin: 0;"><a href="/">KARTA YAXU</a></h1>
                <div style="width:12px; height:12px; background-color: var(--destructive); border: 2px solid var(--border); border-radius: 50%;"></div>
            </div>
            <p class="text-xxs tracking-wider opacity-80" style="margin:0; text-transform:uppercase;">Gameboy Edition</p>
            
            <nav class="flex gap-4 mt-4" style="font-size: 10px; flex-wrap: wrap; justify-content: center;">
                <a href="/wiki/pokemon" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Pokédex</a>
                <a href="/wiki/types" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Tipos</a>
                <a href="/wiki/moves" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Moves</a>
                <a href="/wiki/abilities" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Habilidades</a>
                <a href="/wiki/mechanics/nature" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Natures</a>
                <a href="/wiki/mechanics/status" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Status</a>
                
                {% if let Some(role) = user_role %}
                    <a href="/trainer/dashboard" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border); border-color: var(--gb-darkest); color: var(--gb-darkest); background-color: var(--gb-lightest);">Card</a>
                    {% if role == "editor" %}
                    <a href="/editor/pokemon" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border); border-color: var(--destructive);">✏ Editor</a>
                    {% endif %}
                    <form action="/trainer/logout" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Sair</button>
                    </form>
                {% else %}
                    <a href="/trainer/login" class="btn btn-primary" style="padding: 8px 12px; box-shadow: 2px 2px 0 var(--border);">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 32px; padding-bottom: 32px; min-height: 50vh;">
        {% block content %}{% endblock %}
    </main>

    <footer class="gb-footer elevation-1">
        <div class="container flex flex-col items-center justify-center">
            <div class="text-xxs tracking-wider opacity-80 mb-2" style="text-transform: uppercase;">A tribute to Pokémon & Gameboy</div>
            <div class="flex items-center justify-center gap-2 opacity-80" style="font-size: 8px; text-transform: uppercase;">
                <div style="width:8px; height:8px; background-color: var(--gb-lightest);"></div>
                <span>Karta Yaxu Retro Edition</span>
                <div style="width:8px; height:8px; background-color: var(--gb-lightest);"></div>
            </div>
        </div>
    </footer>
</body>
</html>
