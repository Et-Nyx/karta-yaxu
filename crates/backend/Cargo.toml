[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
engine = { path = "../engine", features = ["db"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
askama = "0.12"
tower-sessions = "0.14"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
