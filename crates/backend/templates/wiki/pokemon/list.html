{% extends "base.html" %}
{% block title %}Pokédex — Karta Yaxu{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4 mt-4">
    <h1 style="font-size: 24px;">Pokédex</h1>
</div>

<div class="grid-cards">
{% for (p, t1, t2) in pokemon %}
<a class="pkmn-card" href="/wiki/pokemon/{{ p.name|slugify }}">
    <div class="pkmn-header">
        <div class="pkmn-id">#{{ p.dex_number }}</div>
        <div class="pkmn-name">{{ p.name }}</div>
    </div>
    <div class="pkmn-sprite-box">
        <img src="/static/sprites/pokemon/{{ p.sprite }}?v=1" alt="{{ p.name }}" onerror="this.style.display='none'">
    </div>
    <div class="pkmn-types">
        <div class="pkmn-type-badge" style="background-color: {{ t1.hexcolor }};">{{ t1.name }}</div>
        {% if let Some(t_opt) = t2 %}
        <div class="pkmn-type-badge" style="background-color: {{ t_opt.hexcolor }};">{{ t_opt.name }}</div>
        {% endif %}
    </div>
</a>
{% endfor %}
</div>
{% endblock %}
