{% extends "base.html" %}

{% block title %}Registro - Karta Yaxu{% endblock %}

{% block content %}
<div class="content-block">
    <h1>Novo Trainer</h1>

    {% if let Some(err) = error %}
    <div style="color: red; margin-bottom: 1rem; padding: 0.5rem; border-radius: 4px;">
        {{ err }}
    </div>
    {% endif %}

    <form method="post" action="/trainer/register">
        <div style="margin-bottom: 1rem;">
            <label for="username" style="display: block; margin-bottom: 0.5rem;">Username</label>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem;">Senha</label>
            <input type="password" id="password" name="password" required minlength="6" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="confirm_password" style="display: block; margin-bottom: 0.5rem;">Confirmar Senha</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border);">
        </div>

        <button type="submit" style="padding: 0.5rem 1rem; background: var(--type-normal); border: none; border-radius: 4px; cursor: pointer;">
            Registrar
        </button>
    </form>

    <p style="margin-top: 1rem;">
        Já tem conta? <a href="/trainer/login">Faça login</a>.
    </p>
</div>
{% endblock %}
