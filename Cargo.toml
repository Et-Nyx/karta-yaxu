[workspace]
members = ["crates/game-data", "crates/web-app", "crates/tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
game-data = { path = "crates/game-data" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
askama = "0.16.1"
tower = { version = "0.5", features = ["util"] }
