{% extends "base.html" %}

{% block title %}Editor de Moves — Karta Yaxu{% endblock %}

{% block content %}
<div class="editor-header">
    <h1>Editor: Moves</h1>
    <a href="/editor/moves/new" class="btn btn-primary">+ Novo Golpe</a>
</div>
<div class="moves-list">
    <table class="wiki-table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for m in moves %}
            <tr>
                <td>{{ m.name }}</td>
                <td>{{ m.type_id }}</td> {# Poderia mostrar o nome do tipo se desse #}
                <td>
                    <a href="/editor/moves/{{ m.name|slugify }}" class="btn btn-sm">Editar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
